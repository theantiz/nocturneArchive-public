<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Nocturne abstract icon">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f0f10"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2e2c7"/>
      <stop offset="100%" stop-color="#c9ad7a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- soft ring -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#121212" stroke-width="6" opacity="0.35"/>

  <!-- abstract crescent moon -->
  <path d="M170 94c-18-22-46-30-70-20-24 10-40 36-40 64 0 30 18 56 44 66 24 9 52 2 70-20 16-20 18-50-4-90z" fill="url(#gold)" opacity="0.95"/>

  <!-- negative cut to make crescent shape -->
  <path d="M156 106c-12-15-33-21-51-14-18 7-30 25-30 44 0 21 12 38 30 45 18 7 39 1 51-14 12-14 13-36-0-61z" fill="#0f0f10" opacity="0.95"/>

  <!-- subtle vertical notch - abstract 'N' hint -->
  <rect x="122" y="84" width="6" height="88" rx="3" fill="#f4e6cf" opacity="0.9" transform="rotate(-6 125 128)"/>

  <!-- tiny star accent -->
  <circle cx="190" cy="72" r="4" fill="#f4e6cf" opacity="0.95"/>

</svg>
